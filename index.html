<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The tab icon is the site's own mark, served from public/assets, not
         the Cloudinary copy that used to sit here: that was a third-party
         request on every page for a file already on disk, and it was the old
         artwork, so the tab and the header had stopped agreeing.

         Both variants, because a tab strip has a colour scheme of its own and
         it is not the site's. The G is near-white in one file and brand navy
         in the other, so whichever one matches the browser's chrome shows a
         solid letterform and the other would show a green swoosh wrapped
         around nothing. A browser that ignores `media` takes the last of
         these, which is the light-chrome one — the commoner default. -->
    <link rel="icon" type="image/png" href="/assets/logo-mark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/assets/logo-mark-day.png" media="(prefers-color-scheme: light)" />

    <!-- iOS composites a home-screen icon onto black rather than honouring
         its transparency, so this one is always the near-white G. -->
    <link rel="apple-touch-icon" href="/assets/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardian Care — Energy Intelligence Built Around the Customer</title>
    <meta
      name="description"
      content="Guardian Care builds energy intelligence around the customer — lifecycle visibility for suppliers, and straight answers for the people on the meter."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- The theme, before anything is painted.

         Blocking and inline on purpose. Deferring this to React means the
         first frame is always the default theme, so a reader who chose the
         day theme gets a full navy page flashed at them on every navigation
         and reload. It is three lines; it costs less than the flash. -->
    <script>
      try {
        var t = localStorage.getItem('gc-theme');
        if (t === 'day') document.documentElement.dataset.theme = 'day';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <link rel="stylesheet" href="/src/index.css" />
  </body>
</html>
